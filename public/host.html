<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI GAME XÃ HỘI CHỦ NGHĨA - Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&family=Poppins:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body class="host-body">
    <div class="bg-side-bg bg-side-left" style="background-image:url('/bg/bacho.jpg')"></div>
    <div class="bg-side-bg bg-side-right" style="background-image:url('/bg/map.png')"></div>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
    </div>
    <div class="particles" id="particles"></div>

    <div class="container host-container">

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="screen active">
            <div class="host-lobby-card">
                <div class="lobby-header">
                    <div class="lobby-mascot" data-theme-char>🧚</div>
                    <h1 class="host-title">MINI GAME XÃ HỘI CHỦ NGHĨA</h1>
                </div>

                <div class="lobby-main">
                    <div class="qr-section">
                        <div class="qr-frame" id="qr-frame" onclick="showQrModal()">
                            <div class="qr-placeholder" id="qr-container">
                                <div class="qr-loading">Đang tạo QR...</div>
                            </div>
                            <div class="qr-label">Quét QR để tham gia</div>
                        </div>
                        <div class="game-code-section">
                            <div class="game-code-label">MÃ PHÒNG</div>
                            <div class="game-code" id="game-code">------</div>
                            <button class="btn-copy-code" id="btn-copy-code">Sao chép mã</button>
                            <div class="player-count-section">
                                <span class="player-count-icon">👥</span>
                                <span class="player-count-number" id="player-count">0</span>
                                <span class="player-count-label">người chơi</span>
                            </div>
                            <div class="join-link-section">
                                <div class="join-link-label">LINK THAM GIA</div>
                                <div class="join-link" id="join-link">...</div>
                                <button class="btn-copy-link" id="btn-copy-link" onclick="copyJoinLink()">Sao chép link</button>
                            </div>
                        </div>
                    </div>

                    <div class="player-list-section">
                        <div class="player-list-header">
                            <h3>Danh sách người chơi</h3>
                            <span id="player-count-badge" class="player-badge">0</span>
                        </div>
                        <div class="player-list" id="player-list">
                            <div class="empty-players">Đợi người chơi tham gia...</div>
                        </div>
                    </div>
                </div>

                <div class="lobby-actions">
                    <button class="btn-start" id="btn-start-game" onclick="startGame()" disabled>
                        <span class="btn-text">Bắt đầu</span>
                        <span class="btn-icon">🚀</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- QUIZ SCREEN (HOST VIEW) -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-container host-quiz">
                <div class="quiz-header">
                    <div class="header-left">
                        <div class="stat-box">
                            <span class="stat-icon">📝</span>
                            <span class="stat-text" id="host-progress">1/10</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-icon">👥</span>
                            <span class="stat-text" id="host-player-count">0</span>
                        </div>
                    </div>
                    <div class="stat-box answered-box" id="answered-box">
                        <span class="stat-icon">✅</span>
                        <span class="stat-text"><span id="answered-count">0</span>/<span id="total-count">0</span></span>
                    </div>
                    <button class="btn-end-quiz" onclick="hostEndGame()">
                        <span class="btn-text">Kết thúc</span>
                        <span class="btn-icon">⛔</span>
                    </button>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-track">
                        <div class="progress-fill" id="host-progress-bar"></div>
                    </div>
                    <span class="progress-percent" id="host-progress-percent">0%</span>
                </div>

                <div class="host-timer-container">
                    <div class="timer-circle" id="host-timer-circle">
                        <svg viewBox="0 0 100 100" class="timer-svg">
                            <defs>
                                <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#667eea"/>
                                    <stop offset="100%" stop-color="#f093fb"/>
                                </linearGradient>
                            </defs>
                            <circle cx="50" cy="50" r="42" class="timer-bg-circle"/>
                            <circle cx="50" cy="50" r="42" class="timer-progress-circle" id="host-timer-ring"/>
                        </svg>
                        <div class="timer-content">
                            <span class="timer-number" id="host-timer-number">20</span>
                            <span class="timer-label">giây</span>
                        </div>
                    </div>
                    <div class="host-phase-label" id="host-phase-label"></div>
                </div>

                <div class="question-wrapper">
                    <div class="question-decoration"></div>
                    <div class="question-card">
                        <div class="question-badge">
                            <span class="badge-icon">💡</span>
                            <span class="badge-text" id="host-question-number">Câu 1</span>
                        </div>
                        <h2 class="question-text" id="host-question-text"></h2>
                    </div>
                </div>

                <div id="host-options" class="options-container"></div>

                <div id="host-result-area" class="host-result-area" style="display:none;">
                    <div class="answer-distribution" id="answer-distribution"></div>
                    <div class="leaderboard-preview">
                        <h3 class="leaderboard-title">🏆 Bảng xếp hạng</h3>
                        <div class="mini-leaderboard" id="mini-leaderboard"></div>
                    </div>
                    <button class="btn-next" id="host-next-btn" onclick="hostNextQuestion()">
                        <span class="btn-text" id="host-next-text">Câu tiếp theo</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- FINAL SCREEN -->
        <div id="final-screen" class="screen">
            <div class="result-content final-content">
                <div class="result-decoration">
                    <div class="decoration-circle"></div>
                    <div class="decoration-circle"></div>
                    <div class="decoration-circle"></div>
                </div>
                <div class="trophy-container">
                    <div class="trophy-glow"></div>
                    <div class="trophy-icon" id="final-icon">🏆</div>
                </div>
                <h1 class="result-title">Kết thúc!</h1>
                <p class="result-message">Tổng kết điểm số</p>

                <div class="final-leaderboard-container" id="final-leaderboard-container">
                    <div class="podium" id="podium"></div>
                    <div class="final-leaderboard-list" id="final-leaderboard-list"></div>
                </div>

                <button class="btn-restart" onclick="resetGame()">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">Tạo phòng mới</span>
                </button>
            </div>
        </div>
    </div>

    <button class="theme-fab" id="theme-fab" onclick="toggleThemeModal()" title="Chọn skin">💜</button>

    <div class="qr-modal" id="qr-modal" onclick="closeQrModal(event)">
        <div class="qr-modal-card">
            <span class="qr-modal-close" onclick="closeQrModal()">✕</span>
            <div class="qr-modal-frame" id="qr-modal-frame"></div>
            <div class="qr-modal-label">Quét QR để tham gia phòng</div>
        </div>
    </div>

    <div class="theme-modal" id="theme-modal" onclick="closeThemeModal(event)">
        <div class="theme-modal-card">
            <div class="theme-modal-header">
                <span class="theme-modal-title">🎨 Chọn Skin</span>
                <span class="theme-modal-close" onclick="closeThemeModal()">✕</span>
            </div>
            <div class="theme-grid" id="theme-grid"></div>
        </div>
    </div>

    <script src="theme.js?v=9"></script>
    <script src="host.js?v=9"></script>
</body>
</html>
